<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMN Members</title>
<style>
  :root { --navy:#132b4c; --navy2:#1d3d66; --gold:#c8a45d; --bg:#f4f6f9; --card:#fff; --text:#16243a; --muted:#5f6e82; --line:#dde3ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  .nav { background:#fff; border-bottom:1px solid var(--line); }
  .nav-in { max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--navy); }
  .brand img { width:56px; height:56px; border-radius:50%; }
  .brand b { display:block; font-size:1.15rem; letter-spacing:.02em; }
  .brand span { font-size:.78rem; color:var(--muted); }
  .nav-btn { background:var(--navy); color:#fff; text-decoration:none; font-weight:600; padding:10px 18px; border-radius:8px; font-size:.95rem; }
  header.hero { background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%); color:#fff; padding:36px 16px 40px; }
  .hero-in { max-width:1100px; margin:0 auto; }
  .eyebrow { color:var(--gold); font-size:.75rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; margin:0 0 10px; }
  header.hero h1 { margin:0 0 8px; font-size:2.1rem; line-height:1.15; }
  header.hero p.sub { margin:0; opacity:.9; max-width:560px; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 32px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .controls input, .controls select { flex:1 1 200px; padding:11px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  .controls input:focus, .controls select:focus { outline:2px solid var(--gold); outline-offset:1px; }
  .count { color:var(--muted); font-size:.9rem; margin:6px 0 10px; }
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 16px; border-bottom:1px solid var(--line); }
  th { background:var(--navy); color:#fff; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; border-bottom:3px solid var(--gold); }
  tbody tr:nth-child(even) { background:#f8fafc; }
  tr:last-child td { border-bottom:none; }
  .msg { padding:24px; text-align:center; color:var(--muted); }
  .back { display:inline-block; margin-top:16px; color:var(--navy); text-decoration:none; font-weight:700; border-bottom:2px solid var(--gold); }
  footer { text-align:center; color:var(--muted); font-size:.82rem; padding:18px 16px 28px; }
  @media (max-width:600px){ header.hero h1{font-size:1.6rem;} th,td{padding:9px 10px;} }
</style>
</head>

<header class="hero"><div class="hero-in">
  <p class="eyebrow">A Regional Network &middot; Established 2022</p>
  <h1>Our Members</h1>
  <p class="sub">Muslim women across Southern Africa united through faith, empowerment and collective action.</p>
</div></header>
<main>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by name…" aria-label="Search by name">
    <select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
    <select id="type" aria-label="Filter by membership type"><option value="">All membership types</option></select>
  </div>
  <div class="count" id="count"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Country</th><th>Membership</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="msg">Loading members…</td></tr></tbody>
    </table>
  </div>
  <a class="back" href="index.html">&larr; Back to home</a>
</main>

<script src="js/config.js"></script>
<script>
(function () {
  var members = [];
  var rows = document.getElementById('rows');
  var countEl = document.getElementById('count');
  var searchEl = document.getElementById('search');
  var countryEl = document.getElementById('country');
  var typeEl = document.getElementById('type');

  function showMessage(text) {
    rows.innerHTML = '';
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.colSpan = 3;
    td.className = 'msg';
    td.textContent = text;
    tr.appendChild(td);
    rows.appendChild(tr);
    countEl.textContent = '';
  }

  function fillSelect(select, values) {
    values.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      select.appendChild(o);
    });
  }

  function unique(key) {
    var seen = {};
    members.forEach(function (m) { seen[m[key]] = true; });
    return Object.keys(seen).sort();
  }

  function render() {
    var q = searchEl.value.trim().toLowerCase();
    var c = countryEl.value;
    var t = typeEl.value;
    var list = members.filter(function (m) {
      return (!q || m.name.toLowerCase().indexOf(q) !== -1) &&
             (!c || m.country === c) &&
             (!t || m.type === t);
    });
    rows.innerHTML = '';
    if (!list.length) { showMessage('No members match your search.'); return; }
    list.forEach(function (m) {
      var tr = document.createElement('tr');
      [m.name, m.country, m.type].forEach(function (text) {
        var td = document.createElement('td');
        td.textContent = text;
        tr.appendChild(td);
      });
      rows.appendChild(tr);
    });
    countEl.textContent = 'Showing ' + list.length + ' of ' + members.length + ' members';
  }

  async function load() {
    var url = window.SAMN_CONFIG && window.SAMN_CONFIG.MEMBERS_FEED_URL;
    if (!url) { showMessage('Members feed is not configured yet.'); return; }
    try {
      var res = await fetch(url);
      var data = await res.json();
      if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : 'Unexpected response');
      members = data;
      fillSelect(countryEl, unique('country'));
      fillSelect(typeEl, unique('type'));
      render();
    } catch (e) {
      console.error('Member feed failed:', e);
      showMessage('Could not load the member list. Please try again later.');
    }
  }

  searchEl.addEventListener('input', render);
  countryEl.addEventListener('change', render);
  typeEl.addEventListener('change', render);
  load();
})();
</script>
