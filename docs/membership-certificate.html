<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMN Membership Certificate</title>
<style>
  :root { --navy:#0a1f7a; --gold:#e0a912; --bg:#f4f6fb; --card:#fff; --text:#1a1a2e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1230; --card:#151b44; --text:#eef0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, serif; background:var(--bg); color:var(--text); padding:16px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { color: var(--navy); font-size: 1.4rem; }
  @media (prefers-color-scheme: dark) { h1 { color:#cfd6ff; } }
  .panel { background:var(--card); border:2px solid var(--gold); border-radius:12px; padding:14px; margin-bottom:16px; }
  label { display:block; font-weight:bold; margin:10px 0 6px; }
  input { width:100%; padding:10px; font-size:1rem; border:1px solid #99a; border-radius:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button { background:var(--navy); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:1rem; cursor:pointer; }
  button.alt { background:var(--gold); color:#222; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:12px; font-weight:bold; }
  #out { display:none; }
  canvas { width:100%; height:auto; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.25); display:block; }
  @media print {
    body { background:#fff; padding:0; }
    .panel, h1, .row { display:none; }
    canvas { box-shadow:none; border-radius:0; }
    @page { size: landscape; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SAMN Membership Certificate</h1>
  <div class="panel">
    <p>Approved members: enter your membership number and surname to get your certificate.</p>
    <label for="no">Membership number</label>
    <input id="no" type="text" autocomplete="off" maxlength="30">
    <label for="sn">Surname</label>
    <input id="sn" type="text" autocomplete="family-name" maxlength="60">
    <div class="row"><button id="go">Get my certificate</button></div>
    <div id="msg" role="status"></div>
  </div>
  <div id="out">
    <div class="row" style="margin:0 0 12px">
      <button id="dl">Download PNG</button>
      <button id="pr" class="alt">Print</button>
    </div>
    <canvas id="c" width="1536" height="1024"></canvas>
  </div>
</div>
<script>
(function () {
  // ===== FILL THESE IN (Supabase > Project Settings > API) =====
  var SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
  var SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
  // =============================================================

  function hdrs() {
    var h = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY };
    if (SUPABASE_ANON_KEY.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
    return h;
  }
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var noIn = document.getElementById('no'), snIn = document.getElementById('sn');
  var msg = document.getElementById('msg'), out = document.getElementById('out');
  var go = document.getElementById('go');
  var BOX = { x: 80, y: 487, w: 1376, h: 86 };
  var img = new Image(), imgReady = false, current = null;

  img.onload = function () { imgReady = true; };
  img.src = 'membership-certificate.png';

  try {
    var q = new URLSearchParams(location.search);
    if (q.get('no')) noIn.value = q.get('no').slice(0, 30);
  } catch (e) {}

  function draw(name, num) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0a1f7a';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold 30px Georgia, "Times New Roman", serif';
    ctx.fillText('Membership No: ' + num, BOX.x + BOX.w - 8, BOX.y - 12);
    var size = 62, maxW = BOX.w - 60;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    do {
      ctx.font = 'italic bold ' + size + 'px Georgia, "Times New Roman", serif';
      size -= 2;
    } while (ctx.measureText(name).width > maxW && size > 24);
    ctx.fillText(name, BOX.x + BOX.w / 2, BOX.y + BOX.h / 2 + 3);
  }

  function show(text) { msg.textContent = text; }

  go.addEventListener('click', function () {
    var no = noIn.value.trim(), sn = snIn.value.trim();
    out.style.display = 'none';
    if (!no || !sn) { show('Please enter your membership number and surname.'); return; }
    if (!imgReady) { show('The certificate is still loading. Try again in a moment.'); return; }
    go.disabled = true; show('Checking your membership...');
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_certificate', {
      method: 'POST',
      headers: hdrs(),
      body: JSON.stringify({ p_member_no: no, p_surname: sn })
    })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !d.found) {
        show('We could not find that membership number and surname. Please check and try again.');
      } else if (!d.eligible) {
        show('Your application has not been approved yet. Your certificate will be available once it is.');
      } else {
        current = d; draw(d.full_name, d.member_number);
        out.style.display = 'block'; show('');
      }
    })
    .catch(function (e) { show('Something went wrong (' + ((e && e.message) || 'network error') + '). Please try again later or contact a SAMN officer.'); })
    .then(function () { go.disabled = false; });
  });

  document.getElementById('dl').addEventListener('click', function () {
    if (!current) return;
    var a = document.createElement('a');
    a.download = 'SAMN-Membership-Certificate-' + current.member_number.replace(/[^\w\-]+/g, '_') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
  document.getElementById('pr').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>
