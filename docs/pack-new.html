<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMN Welcome Pack</title>
<style>
  :root { --navy:#0a1f7a; --gold:#e0a912; --bg:#eef1f7; --card:#fff; --text:#1a1a2e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1230; --card:#151b44; --text:#eef0ff; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia, serif; background:var(--bg); color:var(--text); padding:16px; }
  .wrap { max-width:900px; margin:0 auto; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--card); border-radius:12px; padding:12px; margin-bottom:16px; }
  button, a.btn { background:var(--navy); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:1rem; cursor:pointer; text-decoration:none; font-family:inherit; }
  a.btn.alt { background:#dfe4f5; color:var(--navy); }
  .hint { font-size:.9rem; opacity:.75; }
  #msg { font-weight:bold; padding:12px; }
  #content { display:none; }
  h2 { color:var(--navy); font-size:1.1rem; margin:20px 0 8px; }
  @media (prefers-color-scheme: dark) { h2 { color:#cfd6ff; } }
  canvas { width:100%; height:auto; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.25); display:block; }

  /* Name tag */
  .tag { width:100mm; max-width:100%; aspect-ratio:100/70; border-radius:10px; overflow:hidden; background:#fff; border:2px solid var(--gold); display:flex; flex-direction:column; box-shadow:0 2px 12px rgba(0,0,0,.25); color:#0a1f7a; }
  .tag .top { background:linear-gradient(135deg,#0a3fb5,#061a66); color:#fff; padding:3mm 4mm; display:flex; align-items:center; gap:3mm; border-bottom:3px solid var(--gold); }
  .tag .top img { width:17mm; height:14mm; border-radius:50%; object-fit:cover; background:#fff; }
  .tag .top .org { font-size:3.1mm; line-height:1.25; font-weight:bold; }
  .tag .top .org small { display:block; color:#ffd24a; font-weight:normal; font-size:2.4mm; letter-spacing:.2mm; }
  .tag .mid { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:2mm 4mm; }
  .tag .role { font-size:2.8mm; letter-spacing:.6mm; text-transform:uppercase; color:#8a6a00; }
  .tag .nm { font-size:7.5mm; font-style:italic; font-weight:bold; line-height:1.15; margin:1.5mm 0; word-break:break-word; }
  .tag .ft { background:#f3f5fc; border-top:2px solid var(--gold); display:flex; justify-content:space-between; padding:2mm 4mm; font-size:3mm; font-weight:bold; }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background:#fff; padding:0; }
    .bar, h2, #msg { display:none !important; }
    body.print-cert .tagwrap { display:none; }
    body.print-card .certwrap { display:none; }
    canvas, .tag { box-shadow:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button id="pc">Print certificate</button>
    <button id="pt">Print name tag</button>
    <a class="btn alt" id="og" href="orientation-guide.pdf">Orientation guide (PDF)</a>
    <span class="hint">Choose “Save as PDF” as the printer to send it digitally.</span>
  </div>
  <div id="msg">Loading your welcome pack...</div>
  <div id="content">
    <div class="certwrap"><h2>Membership certificate</h2><canvas id="c" width="1536" height="1024"></canvas></div>
    <div class="tagwrap"><h2>Name tag</h2>
      <div class="tag">
        <div class="top"><img src="samn-logo.png" alt="SAMN"><div class="org">Southern Africa Muslimah Network<small>FAITH · UNITY · EMPOWERMENT</small></div></div>
        <div class="mid"><div class="role">Member</div><div class="nm" id="tn"></div></div>
        <div class="ft"><span id="tid"></span><span id="tc"></span></div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  // ===== FILL THESE IN (Supabase > Project Settings > API) =====
  var SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
  var SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';
  // =============================================================

  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var msg = document.getElementById('msg'), content = document.getElementById('content');
  var BOX = { x:80, y:487, w:1376, h:86 };
  var img = new Image(), imgReady = new Promise(function (res, rej) { img.onload = res; img.onerror = rej; });
  img.src = 'membership-certificate.png';

  function draw(d) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0a1f7a';
    ctx.textBaseline = 'alphabetic'; ctx.font = 'bold 30px Georgia, serif';
    ctx.textAlign = 'right';
    ctx.fillText('Membership No: ' + d.member_number, BOX.x + BOX.w - 8, BOX.y - 12);
    ctx.textAlign = 'left';
    ctx.fillText('Country branch: ' + d.country, BOX.x + 8, BOX.y - 12);
    var size = 62, maxW = BOX.w - 60;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    do { ctx.font = 'italic bold ' + size + 'px Georgia, serif'; size -= 2; }
    while (ctx.measureText(d.full_name).width > maxW && size > 24);
    ctx.fillText(d.full_name, BOX.x + BOX.w / 2, BOX.y + BOX.h / 2 + 3);
  }

  function printOnly(cls) {
    document.body.className = cls;
    window.print();
    setTimeout(function () { document.body.className = ''; }, 500);
  }
  document.getElementById('pc').onclick = function () { printOnly('print-cert'); };
  document.getElementById('pt').onclick = function () { printOnly('print-card'); };

  var id = '';
  try { id = new URLSearchParams(location.search).get('id') || ''; } catch (e) {}
  if (!/^[0-9a-f-]{36}$/i.test(id)) { msg.textContent = 'This link is not valid. Please use the link in your welcome message.'; return; }

  Promise.all([
    imgReady,
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_member_pack', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_id: id })
    }).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
  ]).then(function (res) {
    var d = res[1];
    if (!d || !d.found) { msg.textContent = 'We could not find this membership. Please contact a SAMN officer.'; return; }
    if (!d.eligible) { msg.textContent = 'Your membership has not been approved yet. Your welcome pack will be available once it is.'; return; }
    draw(d);
    document.getElementById('tn').textContent = d.full_name;
    document.getElementById('tid').textContent = 'ID: ' + d.member_number;
    document.getElementById('tc').textContent = d.country;
    msg.style.display = 'none'; content.style.display = 'block';
  }).catch(function () { msg.textContent = 'Something went wrong. Please try again later or contact a SAMN officer.'; });
})();
</script>
</body>
</html>
